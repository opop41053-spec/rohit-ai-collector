name: Rohit-AI 100% Complete Production Engine

on:
  workflow_dispatch:
    inputs:
      data_category:
        description: 'Select Dataset Category (trading, python, csharp)'
        required: true
        default: 'trading'
        type: choice
        options:
          - trading
          - python
          - csharp

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Category Data Fetch & Auto-Commit
        env:
          TARGET_CAT: ${{ github.event.inputs.data_category }}
        run: |
          python -c "
          import os
          import urllib.request
          import json
          import datetime

          category = os.environ.get('TARGET_CAT', 'trading')
          print(f'🎯 [Cloud Engine] Target Category Selected: {category.upper()}')

          # Category ke hisab se dynamic URL set karna
          if category == 'trading':
              urls = [
                  'https://api.github.com/search/repositories?q=topic:trading+language:python&sort=stars&order=desc',
                  'https://api.github.com/search/repositories?q=topic:algorithmic-trading&sort=stars&order=desc'
              ]
          elif category == 'python':
              urls = [
                  'https://api.github.com/search/repositories?q=language:python+topic:artificial-intelligence&sort=stars&order=desc'
              ]
          else:
              urls = [
                  'https://api.github.com/search/repositories?q=language:csharp+topic:unity&sort=stars&order=desc'
              ]

          combined_data = []
          combined_data.append(f'=== ROHIT-AI MASTER DATASET [{category.upper()} MODE] ===')
          combined_data.append(f'Timestamp: {datetime.datetime.utcnow().isoformat()}')
          combined_data.append('Source: Public APIs & Repositories (0% Mobile Data Consumed)\n')

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      for item in data.get('items', [])[:25]:
                          combined_data.append(f'Project Name: {item.get(\"name\")}')
                          combined_data.append(f'Description: {item.get(\"description\")}')
                          combined_data.append(f'URL: {item.get(\"html_url\")}')
                          combined_data.append(f'Stars: {item.get(\"stargazers_count\")} | Language: {item.get(\"language\")}')
                          combined_data.append('-' * 60)
              except Exception as e:
                  combined_data.append(f'Error fetching {url}: {str(e)}')

          full_text = '\n'.join(combined_data)
          final_dataset = (full_text + '\n\n') * 10

          os.makedirs('collected_data', exist_ok=True)
          filename = 'collected_data/Rohit_AI_Master_Dataset.txt'
          
          with open(filename, 'w', encoding='utf-8') as f:
              f.write(final_dataset)

          print(f'✅ [Success!] Generated {category} dataset. Size: {len(final_dataset)} bytes.')
          "

          # Git auto-commit back to repository
          git config --global user.name "Rohit-AI-Bot"
          git config --global user.email "bot@rohit-ai.internal"
          
          git add collected_data/
          git commit -m "🎯 Auto-collected dataset based on selected category" || echo "No changes to commit"
          git push
          
          echo "🎉 [Complete!] Category-specific raw data successfully stored!"
