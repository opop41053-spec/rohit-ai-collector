<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rohit-AI Control Center</title>
</head>
<body style="font-family: Arial; padding: 40px; background: #0f172a; color: #fff;">
    <h1>🚀 Rohit-AI Cloud Data Collection Engine</h1>
    <p>Select your category and fetch live heavy raw datasets directly from the cloud (0% Mobile Data Consumed):</p>
    
    <label for="categorySelect"><b>Choose Dataset Category:</b></label><br><br>
    <select id="categorySelect" style="padding: 12px; font-size: 16px; border-radius: 5px; width: 320px; background: #1e293b; color: #fff; border: 1px solid #475569;">
        <option value="trading">📈 Algorithmic & Stock Trading</option>
        <option value="python">🐍 Python AI & Libraries</option>
        <option value="csharp">🎮 C# & Unity Architecture</option>
    </select>
    <br><br>
    
    <button onclick="executeEngine()" style="padding: 12px 25px; background: #22c55e; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
        ⚡ Run Cloud Engine Now
    </button>

    <div id="statusBox" style="margin-top: 25px; padding: 15px; background: #1e293b; border-radius: 5px; display: none; border-left: 4px solid #38bdf8;">
        <p id="statusMsg" style="margin: 0; font-size: 15px; color: #38bdf8;"></p>
    </div>

    <script>
        function executeEngine() {
            const category = document.getElementById('categorySelect').value;
            const statusBox = document.getElementById('statusBox');
            const statusMsg = document.getElementById('statusMsg');
            
            statusBox.style.display = "block";
            statusMsg.innerHTML = "🚀 Category <b>[" + category.toUpperCase() + "]</b> selected!<br>👉 Head over to your GitHub Actions tab to watch the engine spin up and fetch heavy raw dataset automatically!";
        }
    </script>
</body>
</html>
