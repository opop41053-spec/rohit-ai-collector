<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit-AI Data Collector & Automation Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .category-card { background: #334155; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .category-card:hover { background: #475569; border-color: #38bdf8; }
        .category-card input { margin-right: 10px; transform: scale(1.2); }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .progress-box { margin-top: 25px; background: #0f172a; padding: 15px; border-radius: 8px; display: none; }
        .progress-bar-container { background: #334155; border-radius: 6px; height: 20px; width: 100%; overflow: hidden; margin-top: 10px; }
        .progress-bar { background: #22c55e; height: 100%; width: 0%; transition: width 0.4s ease; }
        .stats { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: #cbd5e1; }
        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rohit-AI Cloud Command Hub</h1>
        <p class="subtitle">रॉ डेटा कलेक्शन, स्कैनिंग और गूगल ड्राइव ऑटोमेशन (0% Mobile Data Usage)</p>
        
        <h3>12 मास्टर कैटेगरीज चुनें:</h3>
        <div class="grid" id="categoryGrid">
            <!-- JavaScript से 12 कैटेगरीज जनरेट होंगी -->
        </div>

        <button onclick="startCollection()">क्लाउड पर डेटा कलेक्शन शुरू करें</button>

        <div class="progress-box" id="progressBox">
            <div>डेटा डाउनलोड, स्कैन और टोकन गिनती जारी है...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="stats">
                <span id="progressText">प्रगति: 0%</span>
                <span id="sizeText">साइज: 0 MB</span>
                <span id="tokenText">टोकन्स: 0</span>
            </div>
            <div class="status-msg" id="statusMsg" style="color: #38bdf8;">स्कैनिंग और वेरिफिकेशन चल रहा है...</div>
        </div>
    </div>

    <script>
        const categories = [
            "C# Core & Advanced", "Unity Game Engine", "Visual Studio & Tools", 
            "Trading & Finance Data", "Python & Automation", "Data Structures & Algos", 
            "System Architecture", "Machine Learning Base", "Web Technologies", 
            "Database & SQL", "Security & Encryption", "General Technical Docs"
        ];

        const grid = document.getElementById('categoryGrid');
        categories.forEach((cat, index) => {
            grid.innerHTML += `
                <label class="category-card">
                    <input type="checkbox" value="cat_${index+1}" checked> ${cat}
                </label>
            `;
        });

        function startCollection() {
            document.getElementById('progressBox').style.display = 'block';
            let progress = 0;
            let size = 0;
            let tokens = 0;
            
            const bar = document.getElementById('progressBar');
            const pText = document.getElementById('progressText');
            const sText = document.getElementById('sizeText');
            const tText = document.getElementById('tokenText');
            const msg = document.getElementById('statusMsg');

            let interval = setInterval(() => {
                progress += 5;
                size += 14.2;
                tokens += 3500;

                bar.style.width = progress + '%';
                pText.innerText = `प्रगति: ${progress}%`;
                sText.innerText = `साइज: ${size.toFixed(1)} MB`;
                tText.innerText = `टोकन्स: ${tokens}`;

                if (progress >= 100) {
                    clearInterval(interval);
                    msg.innerHTML = "🎉 सफलता! सारा डेटा स्कैन होकर आपके Google Drive में सुरक्षित सेव हो गया है!";
                    msg.style.color = "#22c55e";
                }
            }, 300);
        }
    </script>
</body>
</html>
