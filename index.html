<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rohit-AI Data Control Center</title>
</head>
<body style="font-family: Arial; padding: 30px; background: #0f172a; color: #fff;">
    <h1>🚀 Rohit-AI Cloud Data Collection Engine</h1>
    <p>Select your target dataset category to fetch raw data via Cloud Actions (0% Mobile Data Consumed):</p>
    
    <label for="categorySelect"><b>Choose Dataset Category:</b></label><br><br>
    <select id="categorySelect" style="padding: 10px; font-size: 16px; border-radius: 5px;">
        <option value="trading">Algorithmic & Stock Market Trading</option>
        <option value="python">Python Development & AI Libraries</option>
        <option value="csharp">C# & Unity Game Engine Architecture</option>
    </select>
    <br><br>
    
    <button onclick="triggerCollection()" style="padding: 12px 25px; background: #22c55e; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">
        ⚡ Fetch Raw Data Now
    </button>

    <p id="statusMsg" style="margin-top: 20px; font-style: italic;"></p>

    <script>
        function triggerCollection() {
            const selectedCat = document.getElementById('categorySelect').value;
            document.getElementById('statusMsg.innerHTML = "🚀 Triggering GitHub Action for category: " + selectedCat + " ...";');
            alert("Data collection request for [" + selectedCat + "] is ready! Go to GitHub Actions to run the engine.");
        }
    </script>
</body>
</html>
